name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  skip-public-repo:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipping Claude PR Review because the reusable workflow only supports private caller repositories."

  review:
    if: ${{ github.event.repository.private }}
    permissions:
      contents: read
      pull-requests: write
    uses: Starisian-Technologies/sparxstar-anthropic-workflow/.github/workflows/claude-pr-review.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COMPOSER_RESOLVER_PRIVATE_KEY: ${{ secrets.COMPOSER_RESOLVER_PRIVATE_KEY }}

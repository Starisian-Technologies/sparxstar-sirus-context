packages:
  # Explicitly list only the root package.
  # This prevents pnpm from scanning vendor/ subdirectories (e.g. vendor/automattic/*)
  # as workspace members, which avoids lockfile churn on every `composer install`.
  - '.'

onlyBuiltDependencies:
  - cpu-features
  - esbuild
  - ssh2

overrides:
  glob@>=10.3.7 <=11.0.3: '>=11.1.0'
  npm@<5.7.1: '>=5.7.1'
  npm@<6.13.3: '>=6.13.3'
  npm@<6.13.4: '>=6.13.4'
  npm@<6.14.6: '>=6.14.6'
